openapi: 3.1.0

info:
  title: Useroutr API
  version: "1.0.0"
  description: |
    Universal application funding. Users fund an application with whatever they
    hold, on whatever rail, and the application receives exactly what it needs,
    credited exactly once.

    This document is the single source of truth for every wire type. Server
    handlers, the SDK, the checkout, and the dashboard all consume types
    generated from it. A handler change without a regenerated type fails CI.

servers:
  - url: https://api.useroutr.com/v1
    description: Production
  - url: https://api.sandbox.useroutr.com/v1
    description: Sandbox

security:
  - secretKey: []

tags:
  - name: Funding intents
  - name: Funding addresses
  - name: Customers
  - name: Registry
  - name: Webhooks

paths:
  /funding_intents:
    post:
      tags: [Funding intents]
      summary: Create a funding intent
      operationId: createFundingIntent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFundingIntent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingIntent" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

    get:
      tags: [Funding intents]
      summary: List funding intents
      operationId: listFundingIntents
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/FundingIntentStatus" }
        - name: customer_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: starting_after
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingIntentList" }

  /funding_intents/{id}:
    get:
      tags: [Funding intents]
      summary: Retrieve a funding intent
      operationId: getFundingIntent
      parameters:
        - $ref: "#/components/parameters/FundingIntentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingIntent" }
        "404": { $ref: "#/components/responses/Error" }

  /funding_intents/{id}/options:
    get:
      operationId: listFundingOptions
      summary: Price every way this funding intent could be paid
      tags: [Funding intents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Quotes, best first for the intent's optimize policy.
          content:
            application/json:
              schema:
                type: object
                required: [options]
                properties:
                  options:
                    type: array
                    items: { $ref: "#/components/schemas/Quote" }
        default: { $ref: "#/components/responses/Error" }

  /funding_intents/{id}/accept:
    post:
      operationId: acceptQuote
      summary: Accept a quote, pinning its route
      tags: [Funding intents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string }
      responses:
        "200":
          description: The intent, now awaiting payment, with pay instructions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingIntent" }
        default: { $ref: "#/components/responses/Error" }

  /checkout_sessions:
    post:
      operationId: createCheckoutSession
      summary: Issue a browser credential for one funding intent
      description: |
        Scoped to a funding intent that already exists, so the session grants
        the ability to complete it and nothing more. It cannot be replayed to
        create another intent and cannot change where money goes.
      tags: [Checkout]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [funding_intent_id]
              properties:
                funding_intent_id: { type: string }
      responses:
        "201":
          description: The session token, returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        default: { $ref: "#/components/responses/Error" }

  /checkout_sessions/{id}/handoff:
    post:
      operationId: createHandoff
      summary: Mint a short-lived token for a wallet app round trip
      description: |
        The session token never travels through a deep link or a URL bar. This
        one does, is single use, and expires in about a minute.
      tags: [Checkout]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code_challenge]
              properties:
                code_challenge:
                  type: string
                  minLength: 43
                  description: |
                    Base64url SHA-256 of a verifier your browser keeps. Required,
                    not optional: a handoff token travels through a URL and must
                    be assumed to leak, and an optional binding is one an
                    attacker can strip.
      responses:
        "201":
          description: The handoff token.
          content:
            application/json:
              schema:
                type: object
                required: [handoff_token, expires_at]
                properties:
                  handoff_token: { type: string }
                  expires_at: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /checkout_sessions/resume:
    post:
      operationId: resumeCheckoutSession
      summary: Exchange a handoff token for a session token
      tags: [Checkout]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoff_token, code_verifier]
              properties:
                handoff_token: { type: string }
                code_verifier:
                  type: string
                  minLength: 43
                  description: The verifier whose hash was sent when the handoff was minted.
      responses:
        "201":
          description: A fresh session token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        default: { $ref: "#/components/responses/Error" }

  /rails:
    get:
      tags: [Registry]
      summary: List supported rails and assets
      operationId: listRails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rails]
                properties:
                  rails:
                    type: array
                    items: { $ref: "#/components/schemas/Rail" }

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      description: Server-side only. Never ships to a browser.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every mutating request. Absent is a 400.
      schema: { type: string, minLength: 8, maxLength: 200 }
    FundingIntentId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Decimal:
      type: string
      description: Decimal string. Never a float, never a bare integer.
      pattern: '^-?\d+(\.\d+)?$'
      examples: ["100.00"]

    Money:
      type: object
      required: [amount, asset]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }
        asset:
          type: string
          description: Namespaced. crypto:USDC, fiat:NGN, credit:acme:ai_tokens.
          examples: ["crypto:USDC"]

    EndpointTarget:
      oneOf:
        - type: object
          required: [kind, address]
          properties:
            kind: { const: chain_address }
            address: { type: string }
            memo:
              type: string
              description: Validated against the rail. The only Stellar concession in the public model.
        - type: object
          required: [kind, external_account_id]
          properties:
            kind: { const: bank_account }
            external_account_id: { type: string }
        - type: object
          required: [kind, payment_method_id]
          properties:
            kind: { const: card }
            payment_method_id: { type: string }
        - type: object
          required: [kind, account_id]
          properties:
            kind: { const: ledger_account }
            account_id: { type: string }

    CheckoutSession:
      type: object
      description: |
        A browser credential for one funding intent. The token is shown once and
        only its hash is stored.
      required: [id, session_token, funding_intent_id, expires_at]
      properties:
        id: { type: string, examples: ["cst_..."] }
        session_token: { type: string }
        funding_intent_id: { type: string }
        expires_at: { type: string, format: date-time }

    Quote:
      type: object
      description: |
        An immutable price. Accepting one pins its route; it is never recomputed
        afterwards, and re-quoting produces a new quote rather than editing this.
      required:
        [id, source, pay_amount, receive_amount_min, estimated_duration_seconds, expires_at]
      properties:
        id: { type: string, examples: ["qt_..."] }
        source:
          type: object
          required: [rail, asset]
          properties:
            rail: { type: string }
            asset: { type: string }
        pay_amount: { $ref: "#/components/schemas/Money" }
        receive_amount_min: { $ref: "#/components/schemas/Money" }
        fees: { type: array, items: { type: object, additionalProperties: true } }
        estimated_duration_seconds: { type: integer }
        expires_at: { type: string, format: date-time }

    PayTo:
      type: object
      description: |
        Where to send, for one rail. A memo is present only on rails that carry
        one, and omitting it there loses the payment.
      required: [rail, asset, address]
      properties:
        rail: { type: string, examples: ["stellar"] }
        asset: { type: string, examples: ["crypto:USDC"] }
        address: { type: string }
        memo: { type: string }

    Endpoint:
      type: object
      description: |
        One shape for a bank account, a blockchain address, a card, and an
        internal balance. Used for both sources and destinations: direction is a
        property of the transfer, never of the type.
      required: [rail, asset, target]
      properties:
        rail:
          type: string
          description: Open string, resolved through the registry.
          examples: ["stellar"]
        asset: { type: string, examples: ["crypto:USDC"] }
        target: { $ref: "#/components/schemas/EndpointTarget" }

    RoutePolicy:
      type: object
      properties:
        optimize:
          type: string
          enum: [cost, speed, reliability]
          default: cost
        max_slippage_bps: { type: integer, minimum: 0 }
        allow_destination_call: { type: boolean, default: true }

    CreateFundingIntent:
      type: object
      required: [destination]
      properties:
        amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Omit for open-amount funding.
        presentment_currency: { type: string, examples: ["fiat:USD"] }
        destination: { $ref: "#/components/schemas/Endpoint" }
        customer_id: { type: string }
        reference:
          type: string
          description: Your own order id. Unique per application. Not a substitute for the idempotency header.
        metadata: { type: object, additionalProperties: true }
        policy: { $ref: "#/components/schemas/RoutePolicy" }

    FundingIntentStatus:
      type: string
      description: |
        Route shape never appears here. Values may be added in a minor version,
        so every client switch must carry a default.
      enum:
        - created
        - quoted
        - awaiting_payment
        - payment_received
        - in_review
        - settling
        - settled
        - partially_settled
        - undeliverable
        - failed
        - refund_pending
        - refunded
        - refund_failed
        - expired
        - canceled

    FundingIntent:
      type: object
      required: [id, status, destination, created_at, expires_at]
      properties:
        id: { type: string, examples: ["fi_..."] }
        status: { $ref: "#/components/schemas/FundingIntentStatus" }
        amount: { $ref: "#/components/schemas/Money" }
        destination: { $ref: "#/components/schemas/Endpoint" }
        pay_to:
          type: array
          description: Where the payer should send. One entry per rail that can receive.
          items: { $ref: "#/components/schemas/PayTo" }
        reference: { type: string }
        metadata: { type: object, additionalProperties: true }
        checkout_url: { type: string, format: uri }
        failure: { $ref: "#/components/schemas/FundingFailure" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    FundingIntentList:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FundingIntent" }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"] }

    Rail:
      type: object
      required: [id, kind, name, directions, requires_memo, finality, assets]
      properties:
        id: { type: string }
        kind: { type: string, enum: [chain, bank, card, ledger] }
        name: { type: string }
        directions:
          type: array
          description: Some rails can be paid from but not settled to.
          items: { type: string, enum: [in, out] }
        requires_memo: { type: boolean }
        cctp_domain: { type: [integer, "null"] }
        finality:
          type: object
          required: [typical_seconds, p95_seconds]
          properties:
            typical_seconds: { type: integer }
            p95_seconds: { type: integer }
        assets:
          type: array
          items: { type: string }

    FundingFailure:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: |
            Chain-specific failures are lifted into chain-neutral codes:
            destination_not_ready covers a missing Stellar trustline, an
            unactivated account, and a failed bank verification alike.
          enum:
            - amount_below_minimum
            - amount_above_maximum
            - insufficient_liquidity
            - rail_unavailable
            - provider_error
            - invalid_destination
            - destination_not_ready
            - quote_expired
            - slippage_exceeded
            - compliance_hold
            - compliance_rejected
            - payout_undeliverable
            - refund_undeliverable
            - underpaid
            - overpaid
            - network_error
            - service_unavailable
        message:
          type: string
          description: Safe to display. Never contains a provider name or an internal identifier.
        retryable: { type: boolean }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            type:
              type: string
              enum:
                - validation_error
                - authentication_error
                - permission_error
                - not_found
                - conflict
                - rate_limit
                - provider_error
                - compliance_error
                - internal_error
            param: { type: [string, "null"] }
            retryable: { type: boolean }
            retry_after_seconds: { type: integer }
            docs_url: { type: string, format: uri }
            request_id: { type: string }
